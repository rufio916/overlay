name: probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy
      - run: |
          mkdir -p out
          python nhl_build.py --out out/nhl.json
          python cbb_build.py --out out/cbb.json
          cd out && git init -q && git checkout -q -b rawdata && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm raw
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rawdata
