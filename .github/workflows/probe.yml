name: Probe ESPN feeds (temporary)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          D=$(TZ=America/Los_Angeles date +%Y%m%d); D2=$(TZ=America/Los_Angeles date -d tomorrow +%Y%m%d)
          curl -sSL "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=$D" -o probe/nba_scoreboard_today.json
          curl -sSL "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=$D2" -o probe/nba_scoreboard_tomorrow.json
          curl -sSL "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries" -o probe/nba_injuries.json
          curl -sSL "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries" -o probe/nfl_injuries.json
          ls -la probe
          git config user.name "overlay-bot"; git config user.email "overlay-bot@users.noreply.github.com"
          git add probe && git commit -m "probe ESPN feeds" && git push
