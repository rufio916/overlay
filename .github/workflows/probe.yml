name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://site.api.espn.com/apis/site/v2/sports/football/college-football
          curl -sS "$S/scoreboard?groups=80&limit=300" > sb.json
          python3 - <<'PY'
          import json, subprocess
          sb = json.load(open("sb.json")); ev = sb.get("events", [])
          print("events", len(ev), "week", sb.get("week"))
          withodds = [e for e in ev if e["competitions"][0].get("odds")]
          print("with odds", len(withodds), "states", {e["competitions"][0]["status"]["type"]["state"] for e in ev})
          e = withodds[0] if withodds else ev[0]; c = e["competitions"][0]
          print(e["name"], json.dumps(c.get("odds", [{}])[0])[:900])
          print("rank keys", [x.get("curatedRank") for x in c["competitors"]])
          pre = [x for x in withodds if x["competitions"][0]["status"]["type"]["state"] == "pre"][:3]
          for x in pre:
              gid = x["id"]
              u = f"https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/events/{gid}/competitions/{gid}/odds/100/propBets?lang=en&region=us&limit=1000"
              d = json.loads(subprocess.run(["curl", "-sS", u], capture_output=True, text=True).stdout or "{}")
              import collections
              print(x["name"], "props:", d.get("count"), collections.Counter(i["type"]["name"] for i in d.get("items", [])).most_common(12))
          post = [x for x in ev if x["competitions"][0]["status"]["type"]["state"] == "post"][:1]
          for x in post:
              sm = json.loads(subprocess.run(["curl", "-sS", f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event={x['id']}"], capture_output=True, text=True).stdout)
              for t in sm.get("boxscore", {}).get("players", [])[:1]:
                  for g in t["statistics"]: print(g["name"], g.get("labels"), [a["athlete"]["displayName"] + str(a["stats"]) for a in g["athletes"][:1]])
          PY
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&dates=20261031&limit=300" | python3 -c "import json,sys;d=json.load(sys.stdin);print('last week events',len(d.get('events',[])))"
          curl -sS -o /dev/null -w "cfbd %{http_code}\n" "https://api.collegefootballdata.com/games?year=2026&week=10"
          curl -sSI "https://github.com/sportsdataverse/cfbfastR-data/releases" | head -1
