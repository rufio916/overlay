name: Refresh Overlay data
on:
  schedule:
    - cron: "17 0 * * *"     # every day ~5:17pm Pacific: stats + injury reports (free, no odds credits)
    - cron: "17 15 * * 4"    # Thursday ~7:17am Pacific (GitHub often runs these hours late): PrizePicks + sportsbook lines before TNF (~55 credits)
    - cron: "17 11 * * 0"    # Sunday ~3:17am Pacific (lands before kickoff even if GitHub runs it hours late): lines for Sun/Mon with the latest injury news (~55 credits)
    - cron: "37 17 * * *"    # every day ~10:37am Pacific: NBA lines (posted the morning of each game) + free NFL refresh
  workflow_dispatch:           # "Run workflow" button for a manual refresh
    inputs:
      odds:
        description: "Pull fresh PrizePicks/sportsbook lines (uses ~55 of 500 monthly credits)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas
      - name: Build data (fresh odds Thursday + Saturday mornings, or a manual run with the odds box ticked)
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          WANT_ODDS: ${{ github.event.inputs.odds }}
        run: |
          FETCH=0
          if [ "$EVENT" = "schedule" ] && { [ "$CRON" = "17 15 * * 4" ] || [ "$CRON" = "17 11 * * 0" ]; }; then FETCH=1; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$WANT_ODDS" = "true" ]; then FETCH=1; fi
          # one-off skips to stay inside the monthly credits (UTC dates); remove dates once they pass
          for d in 2026-10-15; do if [ "$EVENT" = "schedule" ] && [ "$(date -u +%F)" = "$d" ]; then FETCH=0; echo "odds skipped for $d"; fi; done
          # never pull twice in one day: if lines were fetched in the last 20 hours (e.g. by a manual run), the scheduled pull skips
          if [ "$FETCH" = "1" ] && [ "$EVENT" = "schedule" ] && python3 -c "import json,sys;from datetime import datetime,timezone as z;f=(json.load(open('data.json')).get('odds') or {}).get('fetched');sys.exit(0 if f and (datetime.now(z.utc)-datetime.fromisoformat(f.replace('Z','+00:00'))).total_seconds()<72000 else 1)"; then FETCH=0; echo "odds already pulled in the last 20 hours; skipping"; fi
          echo "fetch odds: $FETCH"
          if [ "$FETCH" = "1" ]; then export ODDS_API_KEY="$KEY"; fi
          python build_data.py --out data.json
      - run: python assemble.py nfl
      - name: "NBA (free: sportsdataverse box scores + ESPN lines and injuries)"
        run: |
          cp nba.json nba_prev.json 2>/dev/null || true
          if python nba_build.py --out nba.json; then python assemble.py nba; else echo "NBA build failed; keeping the last NBA page"; cp nba_prev.json nba.json 2>/dev/null || true; fi
          rm -f nba_prev.json
      - name: "College football (free: ESPN scores, rankings, DraftKings lines)"
        run: |
          cp cfb.json cfb_prev.json 2>/dev/null || true
          if python cfb_build.py --out cfb.json; then python assemble.py cfb; else echo "CFB build failed; keeping the last page"; cp cfb_prev.json cfb.json 2>/dev/null || true; fi
          rm -f cfb_prev.json
      - name: "NHL (free: ESPN box scores and DraftKings lines)"
        run: |
          cp nhl.json nhl_prev.json 2>/dev/null || true
          if python nhl_build.py --out nhl.json; then python assemble.py nhl; else echo "NHL build failed; keeping the last page"; cp nhl_prev.json nhl.json 2>/dev/null || true; fi
          rm -f nhl_prev.json
      - name: "College basketball (free: ESPN scores, rankings, DraftKings lines)"
        run: |
          cp cbb.json cbb_prev.json 2>/dev/null || true
          if python cbb_build.py --out cbb.json; then python assemble.py cbb; else echo "CBB build failed; keeping the last page"; cp cbb_prev.json cbb.json 2>/dev/null || true; fi
          rm -f cbb_prev.json
      - name: "Today page + track record (free: grades logged picks from box scores)"
        run: |
          python assemble.py nfl; python assemble.py nba; python assemble.py cfb
          if python tracker.py --nfl data.json --nba nba.json --cfb cfb.json --nhl nhl.json --cbb cbb.json --history history.json --out today.json; then python assemble.py today; else echo "Tracker failed; keeping the last Today page"; fi
      - run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add data.json nfl.html nba.json nba.html cfb.json cfb.html cfb_box.json nhl.json nhl.html nhl_box.json cbb.json cbb.html cbb_scores.json history.json today.json index.html
          git diff --cached --quiet || git commit -m "Refresh data"
          git pull --rebase -q || true
          git push
