name: Refresh Overlay data
on:
  schedule:
    - cron: "17 0 * * *"     # every day ~5:17pm Pacific: stats + injury reports (free, no odds credits)
    - cron: "17 17 * * 4"    # Thursday ~10:17am Pacific: PrizePicks + sportsbook lines before TNF (~55 credits)
    - cron: "17 17 * * 6"    # Saturday ~10:17am Pacific: PrizePicks + sportsbook lines for Sun/Mon (~50 credits)
    - cron: "37 17 * * *"    # every day ~10:37am Pacific: NBA lines (posted the morning of each game) + free NFL refresh
  workflow_dispatch:           # "Run workflow" button for a manual refresh
    inputs:
      odds:
        description: "Pull fresh PrizePicks/sportsbook lines (uses ~55 of 500 monthly credits)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas
      - name: Build data (fresh odds Thursday + Saturday mornings, or a manual run with the odds box ticked)
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          WANT_ODDS: ${{ github.event.inputs.odds }}
        run: |
          FETCH=0
          if [ "$EVENT" = "schedule" ] && { [ "$CRON" = "17 17 * * 4" ] || [ "$CRON" = "17 17 * * 6" ]; }; then FETCH=1; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$WANT_ODDS" = "true" ]; then FETCH=1; fi
          # one-off skips to stay inside the monthly credits (UTC dates); remove dates once they pass
          for d in 2026-10-15; do if [ "$EVENT" = "schedule" ] && [ "$(date -u +%F)" = "$d" ]; then FETCH=0; echo "odds skipped for $d"; fi; done
          echo "fetch odds: $FETCH"
          if [ "$FETCH" = "1" ]; then export ODDS_API_KEY="$KEY"; fi
          python build_data.py --out data.json
      - run: python assemble.py nfl
      - name: "NBA (free: sportsdataverse box scores + ESPN lines and injuries)"
        run: |
          cp nba.json nba_prev.json 2>/dev/null || true
          if python nba_build.py --out nba.json; then python assemble.py nba; else echo "NBA build failed; keeping the last NBA page"; cp nba_prev.json nba.json 2>/dev/null || true; fi
          rm -f nba_prev.json
      - name: "Today page + track record (free: grades logged picks from box scores)"
        run: |
          if python tracker.py --nfl data.json --nba nba.json --history history.json --out today.json; then python assemble.py today; else echo "Tracker failed; keeping the last Today page"; fi
      - run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add data.json nfl.html nba.json nba.html history.json today.json index.html
          git diff --cached --quiet || git commit -m "Refresh data"
          git pull --rebase -q || true
          git push
