name: Refresh Overlay data
on:
  schedule:
    - cron: "0 15 * * 3"     # Wed 8am Pacific: stats + first injury report (no odds credits)
    - cron: "0 15 * * 5"     # Fri 8am Pacific: final injury designations (no odds credits)
    - cron: "0 15 * * 6"     # Sat 8am Pacific: stats, injuries + PrizePicks lines
    - cron: "0 15 * * 0"     # Sun 8am Pacific: game-day lines
  workflow_dispatch:           # "Run workflow" button for a manual refresh
    inputs:
      odds:
        description: "Pull fresh PrizePicks/sportsbook lines (uses ~55 of 500 monthly credits)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas
      - run: python build_data.py --out data.json
        env:
          # fresh odds only on Sat/Sun runs (and manual runs with the box ticked); other runs keep the last lines
          ODDS_API_KEY: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.odds) || github.event.schedule == '0 15 * * 3' || github.event.schedule == '0 15 * * 5') && '' || secrets.ODDS_API_KEY }}
      - run: python assemble.py index.html
      - run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
