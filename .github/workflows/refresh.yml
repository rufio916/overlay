name: Refresh Overlay data
on:
  schedule:
    - cron: "0 15 * * 3"     # Wed 8am Pacific: stats + first injury report (no odds credits)
    - cron: "0 15 * * 5"     # Fri 8am Pacific: final injury designations (no odds credits)
    - cron: "0 15 * * 6"     # Sat 8am Pacific: stats + injuries (no odds credits)
    - cron: "0 15 * * 0"     # Sun 8am Pacific: game-day PrizePicks + sportsbook lines (~55 credits)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
    inputs:
      odds:
        description: "Pull fresh PrizePicks/sportsbook lines (uses ~55 of 500 monthly credits)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas
      - name: Build data (fresh odds only Sunday mornings, or a manual run with the odds box ticked)
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          WANT_ODDS: ${{ github.event.inputs.odds }}
        run: |
          FETCH=0
          if [ "$EVENT" = "schedule" ] && [ "$CRON" = "0 15 * * 0" ]; then FETCH=1; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$WANT_ODDS" = "true" ]; then FETCH=1; fi
          echo "fetch odds: $FETCH"
          if [ "$FETCH" = "1" ]; then export ODDS_API_KEY="$KEY"; fi
          python build_data.py --out data.json
      - run: python assemble.py index.html
      - run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
