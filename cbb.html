<style>
/* Layout: sticky top bar + tabs; each tab is a scannable board; player detail slides in as a side sheet (full screen on phones). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --raised:#f6f8fa; --line:#d6dce3;
  --fg:#16202b; --muted:#5b6876; --accent:#c8571b; --accent-soft:#f7e3d7;
  --pos:#13804a; --pos-soft:#dcf1e5; --neg:#b4232c; --neg-soft:#f8dfe0; --warn:#9a6a00; --warn-soft:#f6ecd0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d26; --raised:#1b2530; --line:#2a3644;
  --fg:#e6ebf0; --muted:#8b98a6; --accent:#f08a4b; --accent-soft:#3a2416;
  --pos:#4cc786; --pos-soft:#14301f; --neg:#f0717a; --neg-soft:#3a1a1d; --warn:#e7b74a; --warn-soft:#352a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d26; --raised:#1b2530; --line:#2a3644;
  --fg:#e6ebf0; --muted:#8b98a6; --accent:#f08a4b; --accent-soft:#3a2416;
  --pos:#4cc786; --pos-soft:#14301f; --neg:#f0717a; --neg-soft:#3a1a1d; --warn:#e7b74a; --warn-soft:#352a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:12px 16px 2px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 20px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase;grid-column:1;grid-row:1}
.topin>.week{grid-column:3;grid-row:1;text-align:right;padding:0;white-space:nowrap}
.topin>.sample{grid-column:1/-1;grid-row:3;justify-self:start;margin:0 0 4px}
.topin>.sample:empty,.topin>.sample[hidden]{display:none}
nav.sport{grid-column:2;grid-row:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.sport::-webkit-scrollbar{display:none}
nav.sport a{flex:none;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;line-height:1.1}
nav.sport a:hover{color:var(--fg);border-color:var(--muted)}
nav.sport a[aria-current="page"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
@media (max-width:720px){
  .topin{grid-template-columns:1fr auto;padding-top:10px;gap:8px 12px}
  .brand{font-size:25px}
  nav.sport{grid-column:1/-1;grid-row:2;margin-inline:-16px;padding:0 16px 2px;scroll-padding-inline:16px;gap:5px}
  nav.sport a{font-size:13.5px;padding:6px 0;flex:1 1 0;min-width:46px;text-align:center;letter-spacing:.04em}
  .topin>.week{grid-column:2}
}
.brand span{color:var(--accent)}
.week{font-family:var(--mono);font-size:12px;color:var(--muted);padding-bottom:4px}
.sample{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:4px;margin-bottom:4px}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:24px 0 4px;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0 0 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=range]{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
input[type=range]{padding:0;accent-color:var(--accent);width:160px}
.rv{font-family:var(--mono);color:var(--fg);text-transform:none;letter-spacing:0}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raised)}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
th.num{text-align:right}
.pname{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.pick{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block}
.pick.more{background:var(--pos-soft);color:var(--pos)}
.pick.less{background:var(--neg-soft);color:var(--neg)}
.edge{font-family:var(--mono);font-weight:600}
.edge.hot{color:var(--pos)} .edge.cold{color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;display:inline-block}
.g-A{background:var(--pos-soft);color:var(--pos)} .g-B{background:var(--pos-soft);color:var(--pos);opacity:.8}
.g-C{background:var(--raised);color:var(--muted);border:1px solid var(--line)} .g-D,.g-F{background:var(--neg-soft);color:var(--neg)}
.inj{background:var(--warn-soft);color:var(--warn)}
.empty{padding:24px;color:var(--muted);text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:10px;max-width:80ch}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.game[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.matchup{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.meta{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.gdetail{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel h3{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.injrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.injrow:first-of-type{border-top:0}
.st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap;align-self:flex-start}
.st.Out{background:var(--neg-soft);color:var(--neg)} .st.Doubtful{background:var(--neg-soft);color:var(--neg);opacity:.8} .st.Questionable{background:var(--warn-soft);color:var(--warn)}
/* experts */
.experts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.xhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xname{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase}
.rec{font-family:var(--mono);font-size:12px;color:var(--muted)}
.xpick{border-top:1px solid var(--line);padding:10px 0 2px;display:flex;flex-direction:column;gap:4px}
.xpick .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.why{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:left}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:31;overflow-y:auto;border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:0}
.close{background:var(--raised);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--raised);border-radius:6px;padding:10px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.verdict{border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14px}
.verdict.good{background:var(--pos-soft)} .verdict.bad{background:var(--neg-soft)} .verdict.mid{background:var(--raised)}
.verdict strong{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.sec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
ul.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)} .brand{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style><style>
.banner{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px;max-width:80ch}
.banner b{color:var(--fg)}
.delta{font-family:var(--mono);font-size:12px}
.delta.up{color:var(--pos)} .delta.dn{color:var(--neg)}
input[type=search],input[type=number]{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input[type=search]{width:190px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;padding-bottom:8px}
.star{background:none;border:0;cursor:pointer;font-size:18px;line-height:1;color:var(--line);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--surface);font-family:var(--mono);font-size:11px;line-height:18px;text-align:center;margin-left:4px;vertical-align:2px}
.trend{font-family:var(--mono);font-size:12px;white-space:nowrap}
.trend.up{color:var(--pos)} .trend.dn{color:var(--neg)} .trend.flat{color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"].more{background:var(--pos-soft);color:var(--pos)}
.seg button[aria-pressed="true"].less{background:var(--neg-soft);color:var(--neg)}
.checker{background:var(--raised);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.checker .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.checker input[type=number]{width:96px}
.hits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hits div{background:var(--surface);border-radius:6px;padding:8px}
.hits b{display:block;font-family:var(--mono);font-size:18px}
.hits span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:0}
.mini th,.mini td{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--line);text-align:right}
.mini th:first-child,.mini td:first-child{text-align:left}
.split{background:var(--raised);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:8px}
/* slip */
.slipgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.slipgrid{grid-template-columns:1fr}}
.leg{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.leg:first-of-type{border-top:0}
.legr{display:flex;gap:10px;align-items:center;flex-shrink:0}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;padding:3px 8px;font:inherit}
.corr{font-size:13px;padding:8px 10px;border-radius:6px;margin-top:6px}
.corr.plus{background:var(--pos-soft)} .corr.minus{background:var(--neg-soft)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--raised);border-radius:6px;padding:10px}
.sum b{display:block;font-family:var(--mono);font-size:20px}
.sum span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* heatmap */
.heat td.h{font-family:var(--mono);text-align:center;font-weight:600;min-width:72px}
.heat th.sortable{cursor:pointer}
.heat.fit{min-width:0}
.posseg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.posseg button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.posseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.heat th.sortable:hover{color:var(--fg)}
.envrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.flag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--raised);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.flag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:40}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.subnav button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer}
.subnav button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.addrow input{min-width:0;flex:1 1 220px;max-width:340px}
.slot{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);width:56px}
tr.bench td{opacity:.62}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cmpcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmpcard.win{border-color:var(--pos);box-shadow:0 0 0 1px var(--pos)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.kv span:first-child{color:var(--muted)}
.why{font-size:12px;color:var(--muted)}
.reason{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--pos-soft);color:var(--pos);display:inline-block;margin:1px 2px 1px 0}
/* clickable players */
.plink{color:var(--accent);font-weight:600}
tr.click:hover .plink,.pcard:hover .plink{text-decoration:underline}
td.chev{color:var(--muted);font-size:20px;width:24px;text-align:center;padding-left:0}
tr.click:hover td.chev{color:var(--accent)}
.tip{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.tip b{color:var(--fg)}
.tip button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
/* info toggles */
details.info{margin-top:10px;font-size:12px;color:var(--muted);max-width:80ch}

details.info summary::-webkit-details-marker{display:none}
details.info summary::before{content:"ⓘ";font-size:14px}
details.info p{margin:6px 0 0}
details.inj summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.lede{margin-bottom:12px}
/* filters toggle (phones) */
.ftoggle{display:none}
/* phone cards */
.cards{display:none;flex-direction:column;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .more-link{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.bigline{font-family:var(--mono);font-weight:600;font-size:16px}
@media (max-width:700px){

}
.mv{font-family:var(--mono);font-size:11px;white-space:nowrap}
.mv.up{color:var(--pos)} .mv.dn{color:var(--neg)} .mv.flat{color:var(--muted)}
table.shop tr.bestline td{background:var(--pos-soft)}

.propchip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:6px;padding:5px 8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.propchip:hover{border-color:var(--accent)}
.propchip .pk{font-weight:700;font-size:11px;letter-spacing:.04em}
.propchip .pk.more{color:var(--pos)} .propchip .pk.less{color:var(--neg)}

<script>
const D=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>x==null?"–":Math.round(x*100)+"%";
const fmtOdds=o=>o==null?"–":(o>0?"+"+o:String(o));
const sgn=x=>(x>0?"+":"")+x;
const logo=(t,s=22)=>t&&t.logo?`<img class="logo" src="${esc(t.logo)}" alt="" width="${s}" height="${s}" loading="lazy" onerror="this.remove()">`:"";
const tname=t=>`${t.rank?`<span class="trank">${t.rank}</span>`:""}${esc(t.name)}`;
const when=iso=>new Date(iso).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});
const winTxt=p=>Math.max(p,1-p)>.99?">99%":pct(Math.max(p,1-p));
const GAME=Object.fromEntries(D.games.map(g=>[g.id,g]));
let state={cf:"top",game:null};try{Object.assign(state,JSON.parse(localStorage.getItem("overlay-cbb-v1")||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem("overlay-cbb-v1",JSON.stringify(state));}catch(e){}};
$("#weeklabel").textContent=new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();
$("#updated").textContent="Updated "+new Date(D.generated).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"})+".";
if(!D.ready){$("#warm").hidden=false;$("#warm").innerHTML=`<b>Overlay's team ratings are warming up.</b> Most teams have played ${D.typicalGames} game${D.typicalGames===1?"":"s"}; ratings and leans switch on once they've played about ${D.minGames}, around early to mid December. Until then, the win chances come straight from DraftKings.`;}
$("#cf").value=state.cf;$("#cf").onchange=e=>{state.cf=e.target.value;save();renderGames();};$("#q").oninput=renderGames;
function spreadTxt(g){const o=g.odds;if(!o||o.spreadH==null)return"";return o.spreadH<=0?`${g.home.abbr} ${o.spreadH===0?"PK":o.spreadH}`:`${g.away.abbr} -${o.spreadH}`;}
function list(){const q=$("#q").value.trim().toLowerCase();return D.games.filter(g=>(q?(g.home.name+" "+g.away.name+" "+g.home.abbr+" "+g.away.abbr).toLowerCase().includes(q):state.cf==="all"||(state.cf==="lines"?!!g.odds:(g.home.rank||g.away.rank))));}
function renderGames(){const L=list();const days=[...new Set(L.map(g=>g.day))];
  if(!L.length){$("#gamelist").innerHTML='<div class="panel"><p class="sub">No games match. Try "All games".</p></div>';$("#gamedetail").innerHTML="";return;}
  $("#gamelist").innerHTML=days.map(day=>`<div class="daygroup">${new Date(day+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div><div class="gm-cards">`+L.filter(g=>g.day===day).map(g=>{const o=g.odds,fin=g.state==="post",live=g.state==="in";
    return `<button class="game" aria-pressed="${state.game===g.id}" data-g="${g.id}"><div class="matchup">${logo(g.away)} ${tname(g.away)} ${g.neutral?"vs":"@"} ${logo(g.home)} ${tname(g.home)}</div>

      <div class="meta">${fin||live?`<span><b>${g.away.abbr} ${g.scoreA} · ${g.home.abbr} ${g.scoreH}</b></span>`:g.pH!=null?`<span>${g.pH>=.5?g.home.abbr:g.away.abbr} ${winTxt(g.pH)} to win</span>`:"<span>No line</span>"}</div>
      ${g.leans&&g.leans.length&&!fin?`<div class="envrow">${g.leans.map(l=>`<span class="chip">Lean ${l.type==="spread"?`${esc(l.team)} ${sgn(l.line)}`:`${l.side} ${l.line}`}</span>`).join("")}</div>`:""}</button>`;}).join("")+"</div>").join("");
  const g=GAME[state.game];$("#gamedetail").innerHTML=g&&L.includes(g)?detail(g):"";}
function detail(g){const o=g.odds,H=D.teams[g.home.id]||{},A=D.teams[g.away.id]||{};
  const bets=o?`<div class="panel" style="margin-top:12px"><h3>Lines · ${esc(o.book)}</h3><table class="mini"><thead><tr><th></th><th>${esc(g.away.abbr)}</th><th>${esc(g.home.abbr)}</th></tr></thead><tbody>
    ${o.spreadH!=null?`<tr><td>Spread</td><td>${sgn(-o.spreadH)} (${fmtOdds(o.spreadAOdds)})</td><td>${sgn(o.spreadH)} (${fmtOdds(o.spreadHOdds)})</td></tr>`:""}
    ${o.mlH!=null?`<tr><td>Moneyline</td><td>${fmtOdds(o.mlA)}</td><td>${fmtOdds(o.mlH)}</td></tr><tr><td>Win chance</td><td>${pct(1-g.pH)}</td><td>${pct(g.pH)}</td></tr>`:""}

    ${o.spreadHOpen!=null&&o.spreadH!=null&&o.spreadHOpen!==o.spreadH?`<p class="sub">Spread moved from ${g.home.abbr} ${sgn(o.spreadHOpen)} to ${sgn(o.spreadH)}${o.totalOpen!=null&&o.totalOpen!==o.total?`; total from ${o.totalOpen} to ${o.total}`:""}.</p>`:""}</div>`:`<p class="sub">No DraftKings line for this game.</p>`;
  const m=g.model;const take=D.ready&&m?`<div class="panel" style="margin-top:12px"><h3>Overlay's rough numbers</h3><p>${m.margin>=0?`${esc(g.home.abbr)} by ${m.margin.toFixed(1)}`:`${esc(g.away.abbr)} by ${(-m.margin).toFixed(1)}`}, total about ${m.total.toFixed(0)}.</p>
    ${g.leans.length?`<p>${g.leans.map(l=>`<span class="lean">Lean: ${l.type==="spread"?`${esc(l.team)} ${sgn(l.line)}`:`${l.side} ${l.line}`}</span> (${l.by} off the line)`).join(" · ")}</p>`:'<p class="sub">Close to the market, so no lean.</p>'}
    <p class="sub">Built from scores only, adjusted for opponents and home court. Untested against lines so far, so treat it as a second opinion; the Today page tracks how its leans do.</p></div>`:"";
  return `<div class="panel gamepanel" id="gd"><h2>${logo(g.away,34)} ${tname(g.away)} ${g.neutral?"vs":"@"} ${logo(g.home,34)} ${tname(g.home)}</h2>
    <p class="sub">${g.state==="pre"?when(g.start):esc(g.detail)}${g.tv?` · ${esc(g.tv)}`:""}${g.neutral?" · Neutral site":""}</p>
    <div class="tablebox" style="margin-top:10px"><table class="cmp"><thead><tr><th></th><th>${esc(g.away.abbr)}</th><th>${esc(g.home.abbr)}</th></tr></thead><tbody>
      <tr><td>Record</td><td class="v">${esc(g.away.rec||"–")}</td><td class="v">${esc(g.home.rec||"–")}</td></tr>
      <tr><td>Points per game</td><td class="v">${A.ppg??"–"}</td><td class="v">${H.ppg??"–"}</td></tr>
      <tr><td>Points allowed</td><td class="v">${A.oppg??"–"}</td><td class="v">${H.oppg??"–"}</td></tr>
      ${D.ready?`<tr><td>Overlay rank</td><td class="v">#${A.ratingRank??"–"}</td><td class="v">#${H.ratingRank??"–"}</td></tr>`:""}</tbody></table></div>${bets}${take}</div>`;}
document.addEventListener("click",e=>{const b=e.target.closest(".game");if(!b)return;state.game=state.game===b.dataset.g?null:b.dataset.g;save();renderGames();if(state.game)setTimeout(()=>$("#gd")?.scrollIntoView({behavior:"smooth",block:"start"}),30);});

  if(q.toString())history.replaceState(null,"",location.pathname);})();
